services: 
  mysql_ctn:
    build:
      context: .
      dockerfile: Dockerfile.initial_db
    container_name: mysql_ctn
    ports:
      - "3306:3306"
    volumes:
      - ./workspace:/var/lib/mysql:rw
    networks:
      - shared_net
      

# networks:
#   app_net:

# volumes:
#   mysql_vol:

networks:
  shared_net:
    external: true
    name: shared_network